name: Build (Windows)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake)
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build (Release)
        run: |
          cmake --build build --config Release

      - name: Upload hcs.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: hcs-windows
          path: build/Release/hcs.exe
