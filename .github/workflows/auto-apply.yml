name: Auto apply changes and create PR

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      BOT_PAT: ${{ secrets.BOT_PAT }}

    steps:
      - name: Checkout (use HTTPS, don't use default GITHUB_TOKEN)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify BOT_PAT
        env:
          BOT_PAT: ${{ secrets.BOT_PAT }}
        run: |
          if [ -z "${BOT_PAT}" ]; then echo "ERROR: BOT_PAT empty"; exit 1; fi
          resp=$(curl -s -H "Authorization: token ${BOT_PAT}" https://api.github.com/user)
          login=$(echo "$resp" | sed -n 's/.*"login": *"\([^"]*\)".*/\1/p')
          if [ -z "$login" ]; then echo "ERROR: invalid token or insufficient scope"; echo "$resp"; exit 1; fi
          echo "BOT_PAT valid for user: $login"

      - name: Configure git
        run: |
          git config user.name "hcs-auto-bot"
          git config user.email "bot@example.com"

      - name: Make changes (example)
        run: |
          # ここを自分が自動で適用したい処理に書き換える
          # 例: 既に用意したファイル群をコピーするスクリプトをリポジトリに入れておき、それを実行する
          echo "// automated placeholder" > src/_auto_placeholder.cpp
          git add src/_auto_placeholder.cpp

      - name: Commit if there are changes
        id: commitcheck
        run: |
          if git diff --staged --quiet; then
            echo "no-changes" > changed.txt
          else
            git commit -m "Automated changes (bot)"
            echo "changed" > changed.txt
          fi
          cat changed.txt

      - name: Push branch via PAT
        if: steps.commitcheck.outputs == '' || steps.commitcheck.outcome != 'failure'
        env:
          BOT_PAT: ${{ secrets.BOT_PAT }}
        run: |
          if [ -f changed.txt ] && grep -q "changed" changed.txt; then
            BRANCH="auto/apply-$(date +%s)"
            git branch -M "$BRANCH"
            git remote set-url origin https://x-access-token:${BOT_PAT}@github.com/${{ github.repository }}.git
            git push origin "$BRANCH"
            echo "PUSHED_BRANCH=$BRANCH" >> $GITHUB_OUTPUT
          else
            echo "No changes to push"
          fi

      - name: Create Pull Request
        if: steps.commitcheck.outputs == '' || steps.commitcheck.outcome != 'failure'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.BOT_PAT }}
          commit-message: Automated changes (bot)
          branch: ${{ steps.commitcheck.outputs.PUSHED_BRANCH || '' }}
          title: Apply automated changes (bot)
          body: This PR was created by the automated workflow.
          base: main
